# Render Blueprint for p2p-multiple-groups Signaling Server (Free Tier)
# Pairs with Metered.ca Free STUN/TURN (no credit card required)

services:
  - type: web
    name: p2p-multiple-groups-signaling
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Optional multi-group pre-seeded registry JSON format:
      # '[{"groupId":"alpha","token":"...","name":"Alpha"},{"groupId":"beta","token":"...","name":"Beta"}]'
      - key: P2P_MULTIPLE_GROUPS_GROUPS_JSON
        sync: false
      - key: P2P_MULTIPLE_GROUPS_PUBLIC_SIGNAL_URL
        sync: false
      # Free STUN + TURN via Metered.ca (https://www.metered.ca/stun-turn — free tier, no credit card)
      - key: P2P_MULTIPLE_GROUPS_STUN_URL
        value: stun:stun.relay.metered.ca:80
      - key: P2P_MULTIPLE_GROUPS_TURN_URL
        value: turns:global.relay.metered.ca:443?transport=tcp
      - key: P2P_MULTIPLE_GROUPS_TURN_USERNAME
        sync: false
      - key: P2P_MULTIPLE_GROUPS_TURN_CREDENTIAL
        sync: false
